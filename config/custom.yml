    # custom whisper container for other supported languages
    vosk-en-whisper:
        # image: vosk_server_whisper:latest
        image: ghcr.io/zalozbadev/docker_vosk:unify_recognizers
        privileged: true
        restart: ${RESTART_POLICY:-unless-stopped}
        environment:
            - VOSK_SAMPLE_RATE
            - VOSK_LOG_AUDIO
            - MODEL_PATH_FULL=${MODEL_PATH_FULL_MULTILANG}
            - VOSK_SHOW_WORDS
            - VOSK_REPLACEMENT_FILE=${VOSK_REPLACEMENT_FILE_NONE}
            - VOSK_MODEL_LANGUAGE=en
            - VOSK_WHISPER_MAX_CONTEXT
            - VOSK_WHISPER_DISABLE_TIMESTAMPS
            - VOSK_VAD_ALGO
            - VOSK_WHISPER_NO_FALLBACK
            - VOSK_PROB_THRESHOLD_REJECT=${VOSK_PROB_THRESHOLD_REJECT_MULTI}
            - VOSK_LOGPROB_THRESHOLD_REJECT=${VOSK_LOGPROB_THRESHOLD_REJECT_MULTI}
            - VOSK_REJECT_RESPONSE=${VOSK_REJECT_RESPONSE_MULTI}
            - VOSK_PROB_THRESHOLD_DISCARD=${VOSK_PROB_THRESHOLD_DISCARD_MULTI}
            - VOSK_LOGPROB_THRESHOLD_DISCARD=${VOSK_LOGPROB_THRESHOLD_DISCARD_MULTI}
        volumes:
            - ./logs:/logs
            - ./whisper/:/whisper
            - ./model:/model
        depends_on:
            - transcriber
        runtime: nvidia
        networks:
            meet.jitsi:

    # custom sotra container (libretranslate API)
    sotra-libretranslate:
        # image: sotra_libretranslate:latest
        image: ghcr.io/zalozbadev/sotra_modele:workaround_jitsi_limitation_minimal
        restart: ${RESTART_POLICY:-unless-stopped}
        volumes:
            - ./models1/:/app/models1
        depends_on:
            - transcriber
        networks:
            meet.jitsi:

    libretranslate:
        image: libretranslate/libretranslate:v1.9.5
        restart: ${RESTART_POLICY:-unless-stopped}
        environment:
            # Preload only the language pairs we care about to keep the image small.
            # Override via LT_LOAD_ONLY env at compose time if needed.
            LT_LOAD_ONLY: "en,de,cs,pl"
            LT_DISABLE_WEB_UI: "false"
            LT_UPDATE_MODELS: "false"
        volumes:
            - ./libretranslate-models/:/home/libretranslate/.local
        depends_on:
            - transcriber
        networks:
            meet.jitsi:

    libretranslate-proxy:
        # image: libretranslate_proxy:latest
        image: ghcr.io/zalozbadev/translation_proxy:main
        restart: ${RESTART_POLICY:-unless-stopped}
        environment:
            SOTRA_URL: "http://sotra-libretranslate:3000"
            LIBRETRANSLATE_URL: "http://libretranslate:5000"
            SOTRA_PAIRS: "hsb->de,de->hsb,dsb->de,de->dsb,hsb->dsb,dsb->hsb,cs->hsb,hsb->cs"
        depends_on:
            - transcriber
        networks:
            meet.jitsi:
           
