        restart: ${RESTART_POLICY:-unless-stopped}
        environment:
            - VOSK_SAMPLE_RATE
            - VOSK_LOG_AUDIO
            - MODEL_PATH_FULL=${MODEL_PATH_FULL_MULTILANG}
            - VOSK_SHOW_WORDS
            - VOSK_REPLACEMENT_FILE=${VOSK_REPLACEMENT_FILE_NONE}
            - VOSK_MODEL_LANGUAGE=czech
            - VOSK_WHISPER_MAX_CONTEXT
            - VOSK_WHISPER_DISABLE_TIMESTAMPS
            - VOSK_VAD_ALGO
            - VOSK_WHISPER_NO_FALLBACK
            - VOSK_PROB_THRESHOLD_REJECT=${VOSK_PROB_THRESHOLD_REJECT_MULTI}
            - VOSK_LOGPROB_THRESHOLD_REJECT=${VOSK_LOGPROB_THRESHOLD_REJECT_MULTI}
            - VOSK_REJECT_RESPONSE=${VOSK_REJECT_RESPONSE_MULTI}
            - VOSK_PROB_THRESHOLD_DISCARD=${VOSK_PROB_THRESHOLD_DISCARD_MULTI}
            - VOSK_LOGPROB_THRESHOLD_DISCARD=${VOSK_LOGPROB_THRESHOLD_DISCARD_MULTI}
        volumes:
            - ./logs:/logs
            - ./whisper/:/whisper
            - ./model:/model
        depends_on:
            - transcriber
        runtime: nvidia
