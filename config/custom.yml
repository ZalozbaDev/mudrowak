services:

    # custom whisper container HSB
    vosk-hsb-whisper:
        # image: vosk_server_whisper:latest
        image: ghcr.io/zalozbadev/docker_vosk:unify_recognizers
        privileged: true
        restart: ${RESTART_POLICY:-unless-stopped}
        environment:
            - VOSK_SAMPLE_RATE
            - VOSK_LOG_AUDIO
            - MODEL_PATH_FULL=${MODEL_PATH_FULL_HSB}
            - VOSK_SHOW_WORDS
            - VOSK_REPLACEMENT_FILE=${VOSK_REPLACEMENT_FILE_HSB}
            - VOSK_MODEL_LANGUAGE=en
            - VOSK_WHISPER_MAX_CONTEXT
            - VOSK_WHISPER_DISABLE_TIMESTAMPS
            - VOSK_VAD_ALGO
            - VOSK_WHISPER_NO_FALLBACK
            - VOSK_PROB_THRESHOLD_REJECT=${VOSK_PROB_THRESHOLD_REJECT_HSB}
            - VOSK_LOGPROB_THRESHOLD_REJECT=${VOSK_LOGPROB_THRESHOLD_REJECT_HSB}
            - VOSK_REJECT_RESPONSE=${VOSK_REJECT_RESPONSE_HSB}
            - VOSK_PROB_THRESHOLD_DISCARD=${VOSK_PROB_THRESHOLD_DISCARD_HSB}
            - VOSK_LOGPROB_THRESHOLD_DISCARD=${VOSK_LOGPROB_THRESHOLD_DISCARD_HSB}
        volumes:
            - ./logs:/logs
            - ./whisper/:/whisper
            - ./model:/model
        depends_on:
            - transcriber
        runtime: nvidia
        networks:
            meet.jitsi:

    # custom whisper container DSB
    vosk-dsb-whisper:
        # image: vosk_server_whisper:latest
        image: ghcr.io/zalozbadev/docker_vosk:unify_recognizers
        privileged: true
        restart: ${RESTART_POLICY:-unless-stopped}
        environment:
            - VOSK_SAMPLE_RATE
            - VOSK_LOG_AUDIO
            - MODEL_PATH_FULL=${MODEL_PATH_FULL_DSB}
            - VOSK_SHOW_WORDS
            - VOSK_REPLACEMENT_FILE=${VOSK_REPLACEMENT_FILE_DSB}
            - VOSK_MODEL_LANGUAGE=en
            - VOSK_WHISPER_MAX_CONTEXT
            - VOSK_WHISPER_DISABLE_TIMESTAMPS
            - VOSK_VAD_ALGO
            - VOSK_WHISPER_NO_FALLBACK
            - VOSK_PROB_THRESHOLD_REJECT=${VOSK_PROB_THRESHOLD_REJECT_DSB}
            - VOSK_LOGPROB_THRESHOLD_REJECT=${VOSK_LOGPROB_THRESHOLD_REJECT_DSB}
            - VOSK_REJECT_RESPONSE=${VOSK_REJECT_RESPONSE_DSB}
            - VOSK_PROB_THRESHOLD_DISCARD=${VOSK_PROB_THRESHOLD_DISCARD_DSB}
            - VOSK_LOGPROB_THRESHOLD_DISCARD=${VOSK_LOGPROB_THRESHOLD_DISCARD_DSB}
        volumes:
            - ./logs:/logs
            - ./whisper/:/whisper
            - ./model:/model
        depends_on:
            - transcriber
        runtime: nvidia
        networks:
            meet.jitsi:

    # custom whisper container for other supported languages
    vosk-de-whisper:
